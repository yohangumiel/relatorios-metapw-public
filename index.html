<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#06110a">
  <title>META PW — Central de Relatórios</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #06110a;
      --panel: #0b2113;
      --panel-hover: #10351d;
      --border: #1f4a30;
      --text: #effff4;
      --muted: #7fa18a;
      --green: #60ff9a;
      --gold: #d8b75a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      color: var(--text);
      background:
        radial-gradient(circle at 50% 0%, rgba(40, 198, 94, .16), transparent 42%),
        var(--bg);
      font-family: Inter, "Segoe UI", system-ui, sans-serif;
    }
    main { width: min(980px, calc(100% - 32px)); padding: 56px 0; }
    header { text-align: center; margin-bottom: 36px; }
    .logo { width: min(220px, 55vw); filter: drop-shadow(0 0 24px rgba(96,255,154,.2)); }
    h1 { margin: 18px 0 6px; font-size: clamp(28px, 5vw, 46px); letter-spacing: .06em; }
    header p { margin: 0; color: var(--muted); }
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
    .card {
      min-height: 170px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      color: inherit;
      text-decoration: none;
      background: linear-gradient(145deg, rgba(15, 51, 28, .94), var(--panel));
      border: 1px solid var(--border);
      border-radius: 18px;
      transition: transform .2s ease, border-color .2s ease, background .2s ease;
    }
    .card:hover { transform: translateY(-4px); border-color: var(--green); background: var(--panel-hover); }
    .icon { font-size: 30px; margin-bottom: auto; }
    .card strong { font-size: 18px; }
    .card span { margin-top: 5px; color: var(--muted); font-size: 14px; }
    .featured { border-color: rgba(216,183,90,.65); box-shadow: 0 12px 42px rgba(0,0,0,.22); }
    .featured strong { color: var(--gold); }
    .pending { opacity: .62; cursor: default; }
    .pending:hover { transform: none; border-color: var(--border); background: linear-gradient(145deg, rgba(15, 51, 28, .94), var(--panel)); }
    @media (max-width: 720px) { .grid { grid-template-columns: 1fr; } .card { min-height: 140px; } }
  </style>
</head>
<body>
  <main>
    <header>
      <img class="logo" src="logo_metapw.webp" alt="META PW">
      <h1>CENTRAL DE RELATÓRIOS</h1>
      <p>Guerras, desempenho e voz da comunidade em um só lugar.</p>
    </header>
    <section class="grid" aria-label="Relatórios">
      <a class="card featured" href="guerra_30-07.html">
        <span class="icon">⚔️</span>
        <strong>Última guerra</strong>
        <span>KDA, replay e análises</span>
      </a>
      <article class="card pending">
        <span class="icon">📊</span>
        <strong>Sugestões — 7 dias</strong>
        <span>Em breve — aguardando o canal de sugestões</span>
      </article>
      <article class="card pending">
        <span class="icon">🗓️</span>
        <strong>Sugestões — 30 dias</strong>
        <span>Em breve — aguardando o canal de sugestões</span>
      </article>
    </section>
  </main>
</body>
</html>
